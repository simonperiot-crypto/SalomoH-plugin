name: Build IFMY VOX

on:
  push:
    paths:
      - "vox/**"
      - ".github/workflows/build-vox.yml"
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: vox
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release

      - name: Build AU + VST3
        run: cmake --build build --config Release --target IFMYVOX_AU IFMYVOX_VST3 -- -quiet

      - name: Validate AU (auval, the test Logic runs)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/IFMYVOX_artefacts/Release/AU/IFMY VOX.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aufx Ivox Ifmy

      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/IFMYVOX_artefacts/Release/AU/IFMY VOX.component" dist/
          cp -R "build/IFMYVOX_artefacts/Release/VST3/IFMY VOX.vst3" dist/
          cp INSTALL.txt dist/
          cd dist && zip -qry ../IFMY-VOX-mac.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: IFMY-VOX-mac
          path: vox/IFMY-VOX-mac.zip
